[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alipay-ai-inference"
version = "0.1.0"
description = "Standalone multi-model inference project for transfer receipts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10.3",
    "tqdm>=4.66",
]

[project.scripts]
receipt-model-infer = "receipt_inference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
