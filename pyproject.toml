[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alipay-ai-inference"
version = "0.1.0"
description = "Standalone multi-model inference project for transfer receipts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26; platform_system != 'Windows'",
    "numpy>=1.26,<2; platform_system == 'Windows'",
    "opencv-python>=4.10; platform_system != 'Windows'",
    "opencv-python>=4.10,<4.12; platform_system == 'Windows'",
    "Pillow>=10.3",
    "tqdm>=4.66",
]

[project.scripts]
receipt-model-infer = "receipt_inference.cli:main"
receipt-model-export-onnx = "transfer_receipt_ai.onnx_export:main"
receipt-ocr-build-pseudolabels = "transfer_receipt_ai.ocr_pseudolabels:main"
receipt-ocr-build-lite-dataset = "transfer_receipt_ai.ocr_lite_dataset:main"
receipt-ocr-lite-classifier = "transfer_receipt_ai.ocr_lite_classifier:main"
receipt-ocr-build-truth-dataset = "transfer_receipt_ai.ocr_truth_dataset:main"
receipt-ocr-train = "transfer_receipt_ai.ocr_train:train_main"
receipt-ocr-export-onnx = "transfer_receipt_ai.ocr_train:export_main"
receipt-ocr-evaluate = "transfer_receipt_ai.ocr_evaluate:main"
receipt-paddle-ocr-bundle = "transfer_receipt_ai.paddle_ocr_bundle:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
